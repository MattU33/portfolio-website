<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact - Matt Upton</title>
  <meta name="description" content="Get in touch with Matt Upton.">
  <link rel="stylesheet" href="assets/css/reset.css">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

  <header>
    <a href="index.html" class="logo">Matt Upton</a>
    <nav class="nav-dark">
      <ul class="nav-links">
        <li><a href="index.html">Home</a></li>
        <li><a href="projects.html">Projects</a></li>
        <li><a href="skills.html">Skills</a></li>
        <li><a href="contact.html" class="active">Contact</a></li>
      </ul>
    </nav>
  </header>

  <main class="content-wrapper" style="padding-top: clamp(4rem, 10vh, 6rem);">
    <section class="form-card">
      <h1 style="font-family: Georgia, serif; font-size: clamp(1.6rem, 4vw, 2rem); color: #142e2b; margin-bottom: 0.4rem; text-align: center;">Get In Touch</h1>
      <p style="text-align: center; color: #4b5563; margin-bottom: 1.5rem; font-size: 0.95rem;">Have an inquiry regarding IT support services or web development projects? Send a message below.</p>

      <form id="contactForm">
        <div class="form-group">
          <label for="name">Name</label>
          <input type="text" id="name" name="name" placeholder="Your full name" required>
        </div>

        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" placeholder="your.email@example.com" required>
        </div>

        <div class="form-group">
          <label for="subject">Subject</label>
          <input type="text" id="subject" name="subject" placeholder="Inquiry subject" required>
        </div>

        <div class="form-group">
          <label for="message">Message</label>
          <textarea id="message" name="message" rows="4" placeholder="Write your message here..." required></textarea>
        </div>

        <button type="submit" class="btn-main" style="width: 100%; margin-top: 0.5rem;">Send Message</button>
      </form>
      
      <div id="formSuccess" style="display: none; margin-top: 1rem; padding: 0.8rem; background: #142e2b; color: #ffffff; text-align: center; font-weight: 600;">
        Thank you! Your message has been submitted.
      </div>
    </section>
  </main>

  <footer>
    <p>&copy; 2026 Matt Upton. All Rights Reserved. | IT Support &amp; Front-End Web Development</p>
  </footer>

  <script>
    document.getElementById('contactForm').addEventListener('submit', function(e) {
      e.preventDefault();
      this.reset();
      document.getElementById('formSuccess').style.display = 'block';
    });
  </script>

</body>
</html>
